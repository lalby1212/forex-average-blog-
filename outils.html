<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Outils | Graphiques · Analyse Macro · Calculateurs | Forex Average</title>
<meta name="description" content="Outils de trading — Graphiques live, Analyse Macro, Calculateurs Forex Average."/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#FFD700;--dark:#080808;--card:#0f0f0f;--card2:#141414;
  --border:rgba(255,215,0,0.1);--text:#e8e8e8;--muted:rgba(255,255,255,0.45);
  --nav-h:62px;--tab-h:52px;
}
html,body{height:100%;overflow:hidden;background:var(--dark);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}

/* ═══ NAV ═══ */
#mainNav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);
  background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;}
.nav-container{display:flex;align-items:center;width:100%;max-width:1600px;margin:0 auto;gap:0;}
.logo{font-weight:900;font-size:1.25rem;letter-spacing:-0.01em;text-transform:uppercase;
  text-decoration:none;background:linear-gradient(135deg,#FFD700,#FFC107);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0;}
.logo-sub{display:block;font-size:0.55rem;letter-spacing:1.4px;font-weight:600;margin-top:1px;
  -webkit-text-fill-color:rgba(255,215,0,0.5);color:rgba(255,215,0,0.5);background:none;
  -webkit-background-clip:unset;background-clip:unset;}
.nav-links{display:flex;align-items:center;list-style:none;margin-left:2rem;gap:0.1rem;flex:1;}
.nav-links li a{display:flex;align-items:center;gap:0.25rem;padding:0.4rem 0.75rem;border-radius:7px;
  color:rgba(255,255,255,0.65);text-decoration:none;font-size:0.82rem;font-weight:500;transition:all .18s;}
.nav-links li a:hover,.nav-links li a.active{color:var(--gold);background:rgba(255,215,0,0.07);}
.nav-cta{display:inline-flex;align-items:center;padding:0.38rem 1rem;background:linear-gradient(135deg,#FFD700,#FFA000);
  border-radius:8px;color:#000!important;text-decoration:none;font-size:0.82rem;font-weight:800;
  margin-left:auto;white-space:nowrap;-webkit-text-fill-color:#000;}
.nav-burger{display:none;flex-direction:column;gap:5px;width:36px;height:36px;
  align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;margin-left:auto;}
.nav-burger span{display:block;width:20px;height:2px;background:rgba(255,255,255,0.8);border-radius:2px;}
@media(max-width:820px){.nav-links{display:none;}.nav-burger{display:flex;}}

/* ═══ TAB BAR ═══ */
#tabBar{position:fixed;top:var(--nav-h);left:0;right:0;z-index:999;height:var(--tab-h);
  background:rgba(10,10,10,0.98);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 1.5rem;gap:0.25rem;}
.tab-btn{display:flex;align-items:center;gap:0.4rem;padding:0.45rem 1.1rem;border-radius:8px;
  border:none;background:transparent;color:rgba(255,255,255,0.55);font-size:0.85rem;font-weight:600;
  font-family:inherit;cursor:pointer;transition:all .18s;white-space:nowrap;}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,0.05);}
.tab-btn.active{color:var(--gold);background:rgba(255,215,0,0.08);
  box-shadow:0 2px 0 0 var(--gold) inset,0 -2px 0 0 var(--gold);}
.tab-btn .tab-icon{font-size:1rem;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;margin-left:0.35rem;
  animation:blink 2s infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══ CONTENT ═══ */
.page-content{position:fixed;top:calc(var(--nav-h) + var(--tab-h));left:0;right:0;bottom:0;}
.tab-panel{display:none;width:100%;height:100%;}
.tab-panel.active{display:block;}
.tab-panel iframe{width:100%;height:100%;border:none;display:block;}
</style>
</head>
<body>

<!-- NAV -->
<nav id="mainNav">
  <div class="nav-container">
    <a href="index.html" class="logo">
      Forex Average
      <span class="logo-sub">FOREX · CRYPTO · COMMODITIES</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="marche.html">Marché</a></li>
      <li><a href="outils.html" class="active">Outils</a></li>
      <li><a href="partenaires.html">Partenaires</a></li>
      <li><a href="communaute.html">Communauté</a></li>
    </ul>
    <a href="#" class="nav-cta">Données en direct</a>
    <button class="nav-burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- TAB BAR -->
<div id="tabBar">
  <button class="tab-btn active" onclick="showTab('graphiques',this)">
    <span class="tab-icon">📊</span> Graphiques <span class="live-dot"></span>
  </button>
  <button class="tab-btn" onclick="showTab('macro',this)">
    <span class="tab-icon">🔍</span> Analyse Macro
  </button>
  <button class="tab-btn" onclick="showTab('calculateurs',this)">
    <span class="tab-icon">🧮</span> Calculateurs
  </button>
</div>

<!-- PANELS -->
<div class="page-content">
  <div id="panel-graphiques" class="tab-panel active">
    <iframe src="graphique.html" title="Graphiques Live"></iframe>
  </div>
  <div id="panel-macro" class="tab-panel">
    <iframe src="fondamentaux.html" title="Analyse Macro"></iframe>
  </div>
  <div id="panel-calculateurs" class="tab-panel">
    <iframe src="calculateurs-trading.html" title="Calculateurs de Trading"></iframe>
  </div>
</div>

<script>
function showTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
