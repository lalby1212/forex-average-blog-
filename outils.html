<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Outils | Graphiques · Analyse Macro · Calculateurs | Forex Average</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#FFD700;--dark:#000;--border:rgba(255,215,0,0.15);
  --muted:rgba(255,255,255,0.55);--nav-h:62px;--tab-h:50px;
}
html,body{height:100%;overflow:hidden;background:var(--dark);color:#fff;
  font-family:-apple-system,'SF Pro Text',BlinkMacSystemFont,'Segoe UI',sans-serif;}

/* NAV */
#mainNav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);
  background:rgba(7,7,7,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,215,0,0.14);}
.nav-container{max-width:1380px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;height:100%;gap:0;}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:-0.01em;text-transform:uppercase;
  text-decoration:none;background:linear-gradient(135deg,#FFD700,#FFC107);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0;line-height:1.1;}
.logo-sub{display:block;font-size:0.6rem;letter-spacing:1.5px;color:rgba(255,255,255,0.38);
  font-weight:500;margin-top:-4px;-webkit-text-fill-color:rgba(255,255,255,0.38);}
.nav-links{display:flex;align-items:center;list-style:none;height:100%;margin:0 0 0 2rem;padding:0;flex:1;}
.nav-links li a{display:flex;align-items:center;height:var(--nav-h);padding:0 0.9rem;
  color:rgba(255,255,255,0.72);font-size:0.875rem;font-weight:500;text-decoration:none;
  white-space:nowrap;transition:color .2s;border-bottom:2px solid transparent;}
.nav-links li a:hover,.nav-links li a.active{color:#FFD700;}
.nav-links li a.active{border-bottom-color:#FFD700;}
.nav-spacer{flex:1;}
.nav-cta{display:inline-flex;align-items:center;gap:0.4rem;padding:0.38rem 0.85rem;
  background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.18);
  border-radius:100px;font-size:0.75rem;font-weight:600;color:var(--gold);white-space:nowrap;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-burger{display:none;flex-direction:column;justify-content:center;align-items:center;
  width:40px;height:40px;border:none;background:transparent;cursor:pointer;gap:5px;margin-left:auto;}
.nav-burger span{display:block;width:22px;height:2px;background:rgba(255,255,255,0.8);border-radius:2px;}
@media(max-width:900px){
  .nav-burger{display:flex;}
  .nav-links{display:none;position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
    background:rgba(5,5,5,0.99);flex-direction:column;align-items:stretch;height:auto;
    margin:0;padding:1rem;gap:0;z-index:999;border-top:1px solid rgba(255,215,0,0.12);}
  .nav-links.open{display:flex;}
  .nav-links li a{height:auto;padding:0.85rem 1rem;border-radius:10px;border-bottom:none;
    font-size:0.95rem;font-weight:600;}
  .nav-spacer{display:none;}
  .nav-cta{margin:0.5rem 1rem;}
}

/* TAB BAR */
#tabBar{position:fixed;top:var(--nav-h);left:0;right:0;z-index:999;height:var(--tab-h);
  background:rgba(7,7,7,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,215,0,0.14);display:flex;align-items:center;
  padding:0 1.5rem;gap:0.35rem;}
.tab-wrap{display:flex;gap:0.35rem;background:rgba(14,14,14,0.85);
  border:1px solid rgba(255,215,0,0.12);border-radius:10px;padding:0.3rem;}
.tbtn{display:flex;align-items:center;gap:0.45rem;padding:0.45rem 1.1rem;border-radius:7px;
  border:1px solid transparent;background:transparent;color:rgba(255,255,255,0.55);
  font-size:0.85rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;
  font-family:inherit;}
.tbtn:hover{color:#fff;background:rgba(255,255,255,0.05);}
.tbtn.active{background:rgba(255,215,0,0.1);color:var(--gold);border-color:rgba(255,215,0,0.22);}
@media(max-width:600px){
  .tbtn span.label{display:none;}
  #tabBar{padding:0 0.75rem;}
}

/* CONTENT */
.content{position:fixed;top:calc(var(--nav-h) + var(--tab-h));left:0;right:0;bottom:0;}
.panel{display:none;width:100%;height:100%;}
.panel.active{display:block;}
.panel iframe{width:100%;height:100%;border:none;display:block;}
</style>
</head>
<body>

<!-- NAV -->
<nav id="mainNav">
  <div class="nav-container">
    <a href="index.html" class="logo">
      Forex Average
      <span class="logo-sub">FOREX · CRYPTO · COMMODITIES</span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="marches.html">Marchés</a></li>
      <li><a href="outils.html" class="active">Outils</a></li>
      <li><a href="partenaires.html">Partenaires</a></li>
      <li><a href="communaute.html">Communauté</a></li>
      <div class="nav-spacer"></div>
      <!-- Invité -->
      <li class="nav-auth-guest" style="display:none;list-style:none;">
        <a href="login.html" class="nav-login-btn" style="display:inline-flex;align-items:center;padding:0.42rem 1rem;border:1.5px solid rgba(255,255,255,0.2);border-radius:8px;color:rgba(255,255,255,0.75);text-decoration:none;font-size:0.85rem;font-weight:600;white-space:nowrap;">Connexion</a>
        <a href="pricing.html" class="nav-cta" style="margin-left:0.5rem;">✦ VIP — 24.99€/mois</a>
      </li>
      <!-- Connecté -->
      <li class="nav-auth-user" style="display:none;list-style:none;">
        <div style="display:flex;align-items:center;gap:0.5rem;padding:0.35rem 0.75rem;border:1.5px solid rgba(255,215,0,0.2);border-radius:8px;cursor:pointer;">
          <div class="fa-avatar">?</div>
          <span class="fa-username" style="font-size:0.85rem;font-weight:600;color:rgba(255,255,255,0.85);">Profil</span>
          <span class="fa-plan-badge badge-free" style="margin-left:0.25rem;">Gratuit</span>
          <button class="fa-logout-btn" style="background:none;border:none;cursor:pointer;color:#ef4444;font-size:0.8rem;margin-left:0.5rem;font-family:inherit;" title="Déconnexion">✕</button>
        </div>
      </li>
    </ul>
    <button class="nav-burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- TABS -->
<div id="tabBar">
  <div class="tab-wrap">
    <button class="tbtn active" onclick="show('graphiques',this)">
      📊 <span class="label">Graphiques</span>
    </button>
    <button class="tbtn" onclick="show('macro',this)">
      🔍 <span class="label">Analyse Macro</span>
    </button>
    <button class="tbtn" onclick="show('calculateurs',this)">
      🧮 <span class="label">Calculateurs</span>
    </button>
  </div>
</div>

<!-- PANELS -->
<div class="content">
  <div id="p-graphiques" class="panel active">
    <iframe src="graphique.html" title="Graphiques Live" loading="lazy"></iframe>
  </div>
  <div id="p-macro" class="panel">
    <iframe src="fondamentaux.html" title="Analyse Macro" loading="lazy"></iframe>
  </div>
  <div id="p-calculateurs" class="panel">
    <iframe src="calculateurs-trading.html" title="Calculateurs" loading="lazy"></iframe>
  </div>
</div>

<script>
function show(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('p-' + name).classList.add('active');
  btn.classList.add('active');
}

document.getElementById('burger').addEventListener('click', function(){
  document.getElementById('navLinks').classList.toggle('open');
});

// Masquer la nav interne de chaque iframe (même domaine)
function hideIframeNav(iframe) {
  try {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const src = iframe.src || '';
    const style = doc.createElement('style');

    let css = `#mainNav { display: none !important; }`;

    if (src.includes('graphique')) {
      // strategy-bar est fixed à top:var(--nav-h)=62px → remonter à top:0
      // page-body margin = nav(62px) + strategy(44px) → réduire à 44px seulement
      css += `
        .strategy-bar { top: 0 !important; }
        .page-body {
          margin-top: 44px !important;
          height: calc(100vh - 44px) !important;
        }
      `;
    } else {
      // fondamentaux + calculateurs : sticky nav, le contenu suit naturellement
      css += `body { padding-top: 0 !important; }`;
    }

    style.textContent = css;
    doc.head.appendChild(style);
  } catch(e) {}
}

document.querySelectorAll('iframe').forEach(iframe => {
  iframe.addEventListener('load', function() { hideIframeNav(this); });
  if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
    hideIframeNav(iframe);
  }
});
</script>
<script src="fa-access.js"></script>
</body>
</html>
