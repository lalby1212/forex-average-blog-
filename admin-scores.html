<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Scores | Forex Average</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#FFD700;--dark:#080808;--card:#0f0f0f;--border:rgba(255,215,0,0.12);
  --text:#e8e8e8;--muted:rgba(255,255,255,0.45);--green:#22c55e;--red:#ef4444;}
body{background:var(--dark);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;min-height:100vh;padding:2rem 1rem 4rem;}
.wrap{max-width:860px;margin:0 auto;}
h1{font-size:1.5rem;font-weight:900;color:var(--gold);margin-bottom:.4rem;}
.subtitle{color:var(--muted);font-size:.85rem;margin-bottom:2rem;}

/* Sélecteur instrument */
.select-bar{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:2rem;align-items:center;}
.select-bar label{font-size:.75rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
select{background:#141414;border:1px solid var(--border);color:var(--text);
  padding:.6rem 1rem;border-radius:8px;font-size:.88rem;flex:1;max-width:280px;outline:none;cursor:pointer;}
select:focus{border-color:var(--gold);}
.cat-filter{display:flex;gap:.5rem;flex-wrap:wrap;}
.cat-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:var(--muted);padding:.4rem .9rem;border-radius:6px;font-size:.78rem;cursor:pointer;transition:.2s;}
.cat-btn:hover,.cat-btn.active{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.3);color:var(--gold);}

/* Formulaire */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.75rem;}
.form-section-title{font-size:.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,215,0,.5);margin-bottom:1.25rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
.scores-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.75rem;}
@media(max-width:560px){.scores-grid{grid-template-columns:1fr;}}
.score-field label{display:flex;justify-content:space-between;align-items:center;
  font-size:.78rem;color:var(--muted);margin-bottom:.5rem;}
.score-field .cur-val{font-weight:900;font-size:.9rem;color:var(--gold);}
.score-field .range-wrap{position:relative;}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;
  background:rgba(255,255,255,.1);border-radius:99px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--gold);cursor:pointer;border:2px solid #000;
}
.range-limits{display:flex;justify-content:space-between;font-size:.65rem;color:rgba(255,255,255,.25);margin-top:.25rem;}
.text-fields{display:flex;flex-direction:column;gap:1rem;margin-bottom:1.75rem;}
.text-field label{display:block;font-size:.75rem;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted);margin-bottom:.4rem;}
textarea,input[type=number]{
  width:100%;background:#141414;border:1px solid rgba(255,255,255,.1);
  color:var(--text);border-radius:8px;padding:.7rem .9rem;font-size:.85rem;
  font-family:inherit;outline:none;transition:.2s;resize:vertical;
}
textarea:focus,input[type=number]:focus{border-color:var(--gold);}
.num-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;}
.btn-save{
  background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;
  border:none;padding:.75rem 2rem;border-radius:8px;font-weight:900;
  font-size:.9rem;cursor:pointer;transition:.2s;
}
.btn-save:hover{opacity:.9;transform:translateY(-1px);}
.btn-save:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-reset{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:var(--muted);padding:.75rem 1.5rem;border-radius:8px;font-size:.88rem;cursor:pointer;}
.toast{
  position:fixed;bottom:2rem;right:2rem;padding:.8rem 1.4rem;
  border-radius:10px;font-weight:700;font-size:.88rem;z-index:9999;
  transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{background:#22c55e;color:#000;}
.toast.err{background:#ef4444;color:#fff;}

/* Preview widget */
.preview-title{font-size:.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,215,0,.5);margin:2rem 0 .75rem;}
</style>
</head>
<body>
<!-- Auth guard admin -->
<script>
(function(){
  var u = localStorage.getItem('fa_user');
  var t = localStorage.getItem('fa_token');
  if(!u||!t){ window.location.replace('login.html?redirect=admin-scores.html'); }
})();
</script>

<div class="wrap">
  <h1>⚙️ Scores Macro</h1>
  <p class="subtitle">Saisie manuelle des scores par instrument — sauvegardé dans Supabase</p>

  <!-- Filtres catégorie + sélecteur -->
  <div class="select-bar">
    <label>Catégorie :</label>
    <div class="cat-filter">
      <button class="cat-btn active" data-cat="forex">💱 Forex</button>
      <button class="cat-btn" data-cat="commodity">🥇 Commodities</button>
      <button class="cat-btn" data-cat="crypto">₿ Crypto</button>
      <button class="cat-btn" data-cat="indice">📈 Indices</button>
    </div>
  </div>
  <div class="select-bar" style="margin-top:-.5rem">
    <label>Instrument :</label>
    <select id="instrSelect"></select>
    <button class="btn-reset" onclick="loadInstrument()" style="padding:.6rem 1rem;">🔄 Charger</button>
  </div>

  <!-- Formulaire scores -->
  <div class="form-card">
    <div class="form-section-title">Score Quantitatif</div>
    <div class="scores-grid">
      <div class="score-field">
        <label>Tendance <span class="cur-val" id="v-tendance">0</span></label>
        <div class="range-wrap">
          <input type="range" id="s-tendance" min="-25" max="25" value="0" oninput="syncSlider('tendance')">
          <div class="range-limits"><span>-25</span><span>0</span><span>+25</span></div>
        </div>
      </div>
      <div class="score-field">
        <label>Momentum <span class="cur-val" id="v-momentum">0</span></label>
        <div class="range-wrap">
          <input type="range" id="s-momentum" min="-20" max="20" value="0" oninput="syncSlider('momentum')">
          <div class="range-limits"><span>-20</span><span>0</span><span>+20</span></div>
        </div>
      </div>
      <div class="score-field">
        <label>Volatilité <span class="cur-val" id="v-volatilite">0</span></label>
        <div class="range-wrap">
          <input type="range" id="s-volatilite" min="0" max="15" value="0" oninput="syncSlider('volatilite')">
          <div class="range-limits"><span>0</span><span>7</span><span>15</span></div>
        </div>
      </div>
      <div class="score-field">
        <label>Fondamentaux <span class="cur-val" id="v-fondamentaux">0</span></label>
        <div class="range-wrap">
          <input type="range" id="s-fondamentaux" min="-25" max="25" value="0" oninput="syncSlider('fondamentaux')">
          <div class="range-limits"><span>-25</span><span>0</span><span>+25</span></div>
        </div>
      </div>
      <div class="score-field">
        <label>Sentiment <span class="cur-val" id="v-sentiment_score">0</span></label>
        <div class="range-wrap">
          <input type="range" id="s-sentiment_score" min="-15" max="15" value="0" oninput="syncSlider('sentiment_score')">
          <div class="range-limits"><span>-15</span><span>0</span><span>+15</span></div>
        </div>
      </div>
      <div class="score-field">
        <label>Score Sentimental <span class="cur-val" id="v-score_sentiment">0</span></label>
        <div class="range-wrap">
          <input type="range" id="s-score_sentiment" min="-100" max="100" value="0" oninput="syncSlider('score_sentiment')">
          <div class="range-limits"><span>-100</span><span>0</span><span>+100</span></div>
        </div>
      </div>
    </div>

    <div class="form-section-title">Textes</div>
    <div class="text-fields">
      <div>
        <label>Contexte fondamental</label>
        <textarea id="t-contexte" rows="4" placeholder="Contexte macro actuel, données économiques, événements clés..."></textarea>
      </div>
      <div class="num-row">
        <div>
          <label>Décision fondamentale</label>
          <textarea id="t-decision" rows="2" placeholder="Ex: ACHAT sur repli, attente NFP..."></textarea>
        </div>
        <div>
          <label>Limite / Invalidation</label>
          <textarea id="t-limite" rows="2" placeholder="Ex: Clôture sous 1.0800 invalide le scénario..."></textarea>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-save" id="btnSave" onclick="saveScore()">💾 Sauvegarder</button>
      <button class="btn-reset" onclick="resetForm()">✕ Réinitialiser</button>
      <span id="total-display" style="color:var(--muted);font-size:.85rem;margin-left:auto;">Total : <strong style="color:var(--gold)">0/100</strong></span>
    </div>
  </div>

  <!-- Aperçu widget -->
  <div class="preview-title">APERÇU DU WIDGET</div>
  <div id="score-preview"></div>
</div>

<div class="toast" id="toast"></div>

<script src="fa-scores.js"></script>
<script>
const SB_URL = 'https://bpfpghlpdzevzyhalxov.supabase.co';
const SB_KEY = 'sb_publishable_XHStaFT7Lkp7FRomgGmOFw_8puBQvTZ';

const INSTRUMENTS = {
  forex: ['EUR/USD','GBP/USD','USD/JPY','USD/CHF','AUD/USD','NZD/USD','USD/CAD',
          'EUR/GBP','EUR/JPY','EUR/CHF','EUR/AUD','EUR/CAD','GBP/JPY','GBP/CHF',
          'GBP/AUD','GBP/CAD','AUD/JPY','AUD/CHF','AUD/CAD','NZD/JPY','CAD/JPY','CHF/JPY'],
  commodity: ['XAU/USD','XAG/USD','Platinum','Copper','Palladium','Brent Oil','WTI Oil','Natural Gas'],
  crypto: ['BTC/USD','ETH/USD','SOL/USD','BNB/USD','XRP/USD','ADA/USD','DOGE/USD','AVAX/USD','DOT/USD','MATIC/USD','LTC/USD','LINK/USD'],
  indice: ['S&P 500','NASDAQ','DAX','CAC 40','Nikkei','FTSE 100']
};

let currentCat = 'forex';

function buildSelect(cat) {
  const sel = document.getElementById('instrSelect');
  sel.innerHTML = INSTRUMENTS[cat].map(i => `<option value="${i}">${i}</option>`).join('');
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    buildSelect(currentCat);
  });
});

buildSelect('forex');

function syncSlider(key) {
  const val = parseInt(document.getElementById('s-'+key).value);
  const label = document.getElementById('v-'+key);
  const sign = (key !== 'volatilite' && val >= 0) ? '+' : '';
  label.textContent = sign + val;
  updateTotal();
}

function updateTotal() {
  const keys = ['tendance','momentum','volatilite','fondamentaux','sentiment_score'];
  const total = keys.reduce((s,k) => s + parseInt(document.getElementById('s-'+k).value||0), 0);
  const sign = total >= 0 ? '+' : '';
  document.getElementById('total-display').innerHTML =
    'Total : <strong style="color:var(--gold)">' + sign + total + '/100</strong>';
}

function resetForm() {
  ['tendance','momentum','volatilite','fondamentaux','sentiment_score','score_sentiment'].forEach(k => {
    document.getElementById('s-'+k).value = 0;
    syncSlider(k);
  });
  ['contexte','decision','limite'].forEach(k => { document.getElementById('t-'+k).value = ''; });
  document.getElementById('score-preview').innerHTML = '';
}

function getToken() {
  try {
    for (const k of Object.keys(localStorage)) {
      if (k.startsWith('sb-') && k.endsWith('-auth-token')) {
        const s = JSON.parse(localStorage.getItem(k));
        if (s && s.access_token) return s.access_token;
      }
    }
  } catch(e) {}
  return null;
}

async function loadInstrument() {
  const instr = document.getElementById('instrSelect').value;
  if (!instr) return;
  try {
    const res = await fetch(
      SB_URL + '/rest/v1/market_scores?instrument=eq.' + encodeURIComponent(instr) + '&limit=1',
      { headers: { 'apikey': SB_KEY, 'Accept': 'application/json' } }
    );
    const rows = await res.json();
    if (rows && rows[0]) {
      const d = rows[0];
      ['tendance','momentum','volatilite','fondamentaux','sentiment_score','score_sentiment'].forEach(k => {
        document.getElementById('s-'+k).value = d[k] || 0;
        syncSlider(k);
      });
      ['contexte','decision','limite'].forEach(k => {
        document.getElementById('t-'+k).value = d[k] || '';
      });
      showToast('✅ ' + instr + ' chargé', 'ok');
      updatePreview();
    } else {
      showToast('Aucune donnée pour ' + instr, 'err');
    }
  } catch(e) {
    showToast('Erreur de chargement', 'err');
  }
}

async function saveScore() {
  const instr = document.getElementById('instrSelect').value;
  if (!instr) return;

  const token = getToken();
  if (!token) { showToast('Non connecté', 'err'); return; }

  const payload = {
    instrument:      instr,
    categorie:       currentCat,
    tendance:        parseInt(document.getElementById('s-tendance').value),
    momentum:        parseInt(document.getElementById('s-momentum').value),
    volatilite:      parseInt(document.getElementById('s-volatilite').value),
    fondamentaux:    parseInt(document.getElementById('s-fondamentaux').value),
    sentiment_score: parseInt(document.getElementById('s-sentiment_score').value),
    score_sentiment: parseInt(document.getElementById('s-score_sentiment').value),
    contexte:        document.getElementById('t-contexte').value.trim(),
    decision:        document.getElementById('t-decision').value.trim(),
    limite:          document.getElementById('t-limite').value.trim(),
    updated_at:      new Date().toISOString()
  };

  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '⏳ Sauvegarde...';

  try {
    const res = await fetch(
      SB_URL + '/rest/v1/market_scores?instrument=eq.' + encodeURIComponent(instr),
      {
        method: 'PATCH',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      }
    );

    if (res.status === 204 || res.ok) {
      showToast('✅ Sauvegardé — ' + instr, 'ok');
      updatePreview();
    } else {
      const err = await res.text();
      showToast('Erreur : ' + err.slice(0,60), 'err');
    }
  } catch(e) {
    showToast('Erreur réseau', 'err');
  }

  btn.disabled = false; btn.textContent = '💾 Sauvegarder';
}

function updatePreview() {
  const instr = document.getElementById('instrSelect').value;
  if (instr && window.FAScores) FAScores.render('score-preview', instr);
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Charger auto au changement d'instrument
document.getElementById('instrSelect').addEventListener('change', loadInstrument);
</script>
</body>
</html>
