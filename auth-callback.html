<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion en cours…</title>
  <style>
    body { margin:0; background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:-apple-system,sans-serif; color:#fff; }
    .wrap { text-align:center; max-width:400px; padding:2rem; }
    .spinner { width:40px; height:40px; border:3px solid rgba(255,215,0,0.2); border-top-color:#FFD700; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 1rem; }
    @keyframes spin { to { transform:rotate(360deg); } }
    p { color:rgba(255,255,255,0.55); font-size:.9rem; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <p>Connexion en cours…</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://bpfpghlpdzevzyhalxov.supabase.co';
const SB_KEY = 'sb_publishable_XHStaFT7Lkp7FRomgGmOFw_8puBQvTZ';

/* Implicit flow : token dans le hash #access_token=... */
const sb = window.supabase.createClient(SB_URL, SB_KEY, {
  auth: { flowType: 'implicit', detectSessionInUrl: true }
});

function finalize(session) {
  if (!session) return;
  var u = session.user || {};
  var meta = u.user_metadata || {};
  var name = meta.name || meta.full_name || meta.display_name || (u.email||'').split('@')[0];
  localStorage.setItem('fa_user',  JSON.stringify({ email: u.email, name: name }));
  localStorage.setItem('fa_token', session.access_token || '');
  if (!localStorage.getItem('fa_plan')) localStorage.setItem('fa_plan', 'free');
  window.location.replace('marches.html');
}

sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_IN' && session) finalize(session);
});

sb.auth.getSession().then(function(res) {
  if (res.data && res.data.session) finalize(res.data.session);
});

/* Si erreur dans l'URL */
var params = new URLSearchParams(location.search);
if (params.get('error')) {
  document.querySelector('p').textContent = 'Erreur de connexion. Retour…';
  setTimeout(function(){ window.location.replace('login.html'); }, 2000);
} else {
  setTimeout(function(){ window.location.replace('login.html'); }, 10000);
}
</script>
</body>
</html>
