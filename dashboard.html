<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --gold:#FFD700; --gold-2:#FFA500; --gold-soft:rgba(255,215,0,0.1); --gold-b:rgba(255,215,0,0.2);
    --black:#000; --g0:#050505; --g1:#0a0a0a; --g2:#111; --g3:#1a1a1a;
    --white:#fff; --t2:rgba(255,255,255,0.65); --t3:rgba(255,255,255,0.4); --t4:rgba(255,255,255,0.2);
    --green:#22c55e; --green-soft:rgba(34,197,94,0.12);
    --red:#ef4444; --red-soft:rgba(239,68,68,0.12);
    --blue:#3b82f6; --r:10px; --rl:14px;
  }
  html { scroll-behavior:smooth; }
  body { font-family:'Inter',sans-serif; background:var(--g0); color:#fff; line-height:1.5; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:linear-gradient(rgba(255,255,255,0.012) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,0.012) 1px,transparent 1px);
    background-size:60px 60px; pointer-events:none; z-index:0;
  }

  /* TOP BAR */
  .topbar {
    position:sticky; top:0; z-index:100; height:56px;
    background:rgba(7,7,7,0.96); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--gold-b);
    display:flex; align-items:center; padding:0 1.5rem; gap:1rem;
  }
  .topbar-burger { display:none; background:none; border:none; cursor:pointer; padding:0.4rem; }
  .topbar-burger span { display:block; width:22px; height:2px; background:#fff; border-radius:2px; margin:5px 0; }
  .topbar-logo {
    font-weight:900; font-size:1.05rem; letter-spacing:-0.01em; text-transform:uppercase;
    text-decoration:none; line-height:1;
  }
  .topbar-logo-sub {
    display:block; font-size:0.55rem; letter-spacing:1.4px; color:rgba(255,255,255,0.38);
    font-weight:500; margin-top:1px; -webkit-text-fill-color:rgba(255,255,255,0.38);
  }
  .topbar-spacer { flex:1; }
  .currency-toggle{display:flex;gap:3px;align-items:center;}
  .curr-btn{background:transparent;border:1px solid var(--gold-b);color:var(--text-faint);border-radius:6px;padding:3px 9px;font-size:0.72rem;cursor:pointer;transition:all 0.18s;font-family:inherit;}
  .curr-btn.active{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold);}
  .topbar-vip {
    background:linear-gradient(135deg,#FFD700,#FFA000); color:#000;
    padding:0.42rem 1rem; border-radius:8px; font-weight:800; font-size:0.78rem;
    text-decoration:none; box-shadow:0 2px 12px rgba(255,215,0,0.25);
  }
  .topbar-avatar {
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg,#FFD700,#FFA000); color:#000;
    font-weight:800; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  /* LAYOUT */
  .layout { display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 56px); position:relative; z-index:1; }

  /* SIDEBAR */
  .sidebar {
    background:rgba(8,8,8,0.85); border-right:1px solid rgba(255,255,255,0.04);
    padding:1.4rem 0.85rem; position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar { width:4px; }
  .sidebar::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }
  .sidebar-section { margin-bottom:1.5rem; }
  .sidebar-label {
    font-size:0.65rem; font-weight:800; letter-spacing:0.12em;
    color:rgba(255,255,255,0.32); text-transform:uppercase; padding:0 0.85rem 0.6rem;
  }
  .nav-item {
    position:relative; display:flex; align-items:center; gap:0.7rem;
    padding:0.65rem 0.85rem; margin-bottom:0.2rem;
    border-radius:9px; color:rgba(255,255,255,0.72);
    text-decoration:none; font-size:0.88rem; font-weight:500;
    transition:background 0.15s, color 0.15s;
  }
  .nav-item:hover { background:rgba(255,255,255,0.04); color:#fff; }
  .nav-item.active { background:rgba(255,215,0,0.1); color:var(--gold); font-weight:700; }
  .nav-item.active::before {
    content:''; position:absolute; left:0; width:3px; height:24px;
    background:var(--gold); border-radius:0 3px 3px 0;
  }
  .nav-icon { width:18px; height:18px; flex-shrink:0; }
  .nav-item.featured {
    background:linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,165,0,0.04));
    border:1px solid rgba(255,215,0,0.2); color:var(--gold); font-weight:700; margin-top:0.4rem;
  }
  .nav-item.featured:hover { background:linear-gradient(135deg, rgba(255,215,0,0.14), rgba(255,165,0,0.08)); }

  /* MAIN */
  .main { padding:1.75rem 2rem 4rem; overflow-x:hidden; }
  .page-header {
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;
  }
  .page-greeting { font-size:0.78rem; color:var(--gold); font-weight:600; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:0.4rem; }
  .page-title { font-size:2.1rem; font-weight:800; letter-spacing:-0.02em; line-height:1.1; }
  .page-title span { color:var(--gold); }
  .page-sub { font-size:0.88rem; color:var(--t2); margin-top:0.4rem; }
  .period-tabs {
    display:flex; gap:0.3rem; background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:0.3rem;
  }
  .period-tab {
    padding:0.42rem 0.95rem; font-size:0.78rem; font-weight:600; color:var(--t2);
    cursor:pointer; border:none; background:transparent; border-radius:7px;
    transition:all 0.15s; font-family:inherit;
  }
  .period-tab:hover { color:#fff; }
  .period-tab.active { background:var(--gold); color:#000; font-weight:700; }

  /* DEMO BANNER */
  .demo-banner {
    background:linear-gradient(90deg, rgba(255,215,0,0.08), transparent);
    border:1px solid rgba(255,215,0,0.18); border-radius:var(--r);
    padding:0.9rem 1.2rem; margin-bottom:1.5rem;
    display:flex; align-items:center; gap:0.9rem; font-size:0.86rem;
  }
  .demo-banner-icon { font-size:1.2rem; }
  .demo-banner-text { flex:1; color:var(--t2); }
  .demo-banner-text strong { color:var(--gold); }
  .demo-banner-cta {
    background:var(--gold); color:#000; padding:0.45rem 0.95rem;
    border-radius:7px; font-weight:700; font-size:0.78rem;
    text-decoration:none; white-space:nowrap;
  }

  /* KPI HERO */
  .kpi-row { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:1rem; margin-bottom:1.5rem; }
  .kpi-card {
    background:linear-gradient(135deg, var(--g1), var(--g2));
    border:1px solid rgba(255,255,255,0.06); border-radius:var(--rl);
    padding:1.4rem 1.5rem; position:relative; overflow:hidden;
    transition:border-color 0.2s;
  }
  .kpi-card:hover { border-color:rgba(255,215,0,0.2); }
  .kpi-card.hero {
    background:linear-gradient(135deg, rgba(255,215,0,0.06) 0%, var(--g1) 60%, var(--g2) 100%);
    border:1px solid rgba(255,215,0,0.18);
  }
  .kpi-card.hero::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, var(--gold), transparent);
  }
  .kpi-label {
    font-size:0.7rem; font-weight:700; letter-spacing:0.12em;
    text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:0.7rem;
  }
  .kpi-value { font-size:2.1rem; font-weight:800; line-height:1; letter-spacing:-0.02em; }
  .kpi-card.hero .kpi-value { font-size:2.6rem; }
  .kpi-value.green { color:var(--green); }
  .kpi-value.red { color:var(--red); }
  .kpi-value.gold { color:var(--gold); }
  .kpi-value.neutral { color:var(--t2); }
  .kpi-delta {
    display:inline-flex; align-items:center; gap:0.3rem; margin-top:0.6rem;
    padding:0.25rem 0.6rem; font-size:0.75rem; font-weight:700; border-radius:6px;
  }
  .kpi-delta.up { background:var(--green-soft); color:var(--green); }
  .kpi-delta.down { background:var(--red-soft); color:var(--red); }
  .kpi-sub { font-size:0.74rem; color:var(--t3); margin-top:0.4rem; }
  .kpi-progress { margin-top:0.8rem; height:4px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
  .kpi-progress-bar { height:100%; background:linear-gradient(90deg, var(--gold), #FFC107); border-radius:2px; transition:width 0.6s; }

  /* CHART CARD */
  .card {
    background:linear-gradient(135deg, var(--g1), var(--g2));
    border:1px solid rgba(255,255,255,0.06); border-radius:var(--rl);
    padding:1.4rem; margin-bottom:1.5rem;
  }
  .card-header {
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:1.2rem; gap:1rem; flex-wrap:wrap;
  }
  .card-title { font-size:1.05rem; font-weight:700; color:#fff; }
  .card-sub { font-size:0.8rem; color:var(--t3); margin-top:0.2rem; }
  .card-badge {
    display:inline-flex; align-items:center; gap:0.4rem;
    font-size:0.72rem; font-weight:700; padding:0.3rem 0.7rem;
    border-radius:6px; background:var(--green-soft); color:var(--green);
  }
  .card-badge.gold { background:var(--gold-soft); color:var(--gold); }
  .card-badge.red { background:var(--red-soft); color:var(--red); }
  .card-link { color:var(--gold); text-decoration:none; font-size:0.82rem; font-weight:700; }
  .chart-canvas-wrap { position:relative; width:100%; }
  .equity-chart { height:320px; }
  .bar-chart { height:260px; }
  .donut-chart { height:260px; }

  /* MINI CARDS */
  .mini-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.5rem; }
  .mini-card { background:var(--g1); border:1px solid rgba(255,255,255,0.05); border-radius:var(--r); padding:1rem 1.2rem; }
  .mini-icon {
    width:32px; height:32px; border-radius:8px;
    background:rgba(255,215,0,0.1); color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:0.7rem; font-size:0.95rem;
  }
  .mini-icon.green { background:var(--green-soft); color:var(--green); }
  .mini-icon.red { background:var(--red-soft); color:var(--red); }
  .mini-icon.blue { background:rgba(59,130,246,0.12); color:var(--blue); }
  .mini-label {
    font-size:0.66rem; font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--t3); margin-bottom:0.3rem;
  }
  .mini-value { font-size:1.35rem; font-weight:800; line-height:1; letter-spacing:-0.01em; }
  .mini-value.green { color:var(--green); }
  .mini-value.red { color:var(--red); }
  .mini-value.neutral { color:var(--t2); }
  .mini-sub { font-size:0.72rem; color:var(--t3); margin-top:0.4rem; }

  /* TWO COL */
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem; }
  .two-col-asym { display:grid; grid-template-columns:1.2fr 1fr; gap:1.5rem; margin-bottom:1.5rem; }

  /* TRADE LIST */
  .trade-list { display:flex; flex-direction:column; gap:0.5rem; }
  .trade-row {
    display:grid; grid-template-columns:auto 1fr auto;
    gap:0.8rem; align-items:center; padding:0.75rem 0.95rem;
    background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04);
    border-radius:8px;
  }
  .trade-row:hover { background:rgba(255,255,255,0.04); }
  .trade-dot { width:8px; height:8px; border-radius:50%; }
  .trade-dot.win { background:var(--green); box-shadow:0 0 8px rgba(34,197,94,0.5); }
  .trade-dot.lose { background:var(--red); box-shadow:0 0 8px rgba(239,68,68,0.5); }
  .trade-info { display:flex; flex-direction:column; gap:0.15rem; min-width:0; }
  .trade-title { font-size:0.88rem; font-weight:700; }
  .trade-meta { font-size:0.72rem; color:var(--t3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trade-amt { font-weight:800; font-size:0.95rem; min-width:90px; text-align:right; }
  .trade-amt.win { color:var(--green); }
  .trade-amt.lose { color:var(--red); }

  /* WEEKDAY BREAKDOWN */
  .wd-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:0.55rem; margin-top:0.5rem; }
  .wd-cell {
    background:var(--g1); border:1px solid rgba(255,255,255,0.05);
    border-radius:10px; padding:1rem 0.5rem; text-align:center;
    transition:transform 0.15s, border-color 0.15s;
  }
  .wd-cell:hover { transform:translateY(-2px); border-color:rgba(255,215,0,0.3); }
  .wd-day { font-size:0.7rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--t3); margin-bottom:0.5rem; }
  .wd-pnl { font-size:1.05rem; font-weight:800; line-height:1; margin-bottom:0.3rem; letter-spacing:-0.01em; }
  .wd-pnl.green { color:var(--green); }
  .wd-pnl.red { color:var(--red); }
  .wd-pnl.zero { color:var(--t3); }
  .wd-count { font-size:0.72rem; color:var(--t3); }
  .wd-bar { margin-top:0.5rem; height:3px; border-radius:2px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .wd-bar-fill { height:100%; transition:width 0.5s; }
  .wd-bar-fill.green { background:var(--green); }
  .wd-bar-fill.red { background:var(--red); }

  /* EMPTY STATE */
  .empty {
    background:linear-gradient(135deg, var(--g1), var(--g2));
    border:1px dashed rgba(255,215,0,0.25); border-radius:var(--rl);
    padding:3.5rem 2rem; text-align:center; margin-bottom:1.5rem;
  }
  .empty-icon { font-size:3rem; margin-bottom:1rem; }
  .empty-title { font-size:1.4rem; font-weight:800; margin-bottom:0.5rem; }
  .empty-sub { color:var(--t2); margin-bottom:1.5rem; max-width:480px; margin-left:auto; margin-right:auto; }
  .empty-cta {
    display:inline-block; background:var(--gold); color:#000;
    padding:0.85rem 1.5rem; border-radius:9px; font-weight:800;
    text-decoration:none; transition:transform 0.15s;
  }
  .empty-cta:hover { transform:translateY(-2px); }

  /* RESPONSIVE */
  @media(max-width:1100px){
    .kpi-row { grid-template-columns:1fr 1fr; }
    .mini-grid { grid-template-columns:1fr 1fr; }
    .two-col, .two-col-asym { grid-template-columns:1fr; }
  }
  @media(max-width:768px){
    .layout { grid-template-columns:1fr; }
    .sidebar { position:fixed; top:56px; left:-260px; width:240px; transition:left 0.25s; z-index:200; background:rgba(5,5,5,0.98); }
    .sidebar.open { left:0; }
    .topbar-burger { display:block; }
    .main { padding:1rem 1.2rem 3rem; }
    .page-title { font-size:1.6rem; }
    .kpi-row { grid-template-columns:1fr; }
    .mini-grid { grid-template-columns:1fr 1fr; }
    .kpi-card.hero .kpi-value { font-size:2rem; }
    .wd-grid { grid-template-columns:repeat(4,1fr); }
  }
</style>
</head>

<script>
"use strict";

// ════════════════════ DATA ACCESS ════════════════════
function loadPlan() {
  try { return JSON.parse(localStorage.getItem('fa_active_plan') || 'null'); }
  catch(e) { return null; }
}
function loadJournal() {
  // Lire depuis fa_journal_[email] — format journal.html
  try {
    var user = JSON.parse(localStorage.getItem('fa_user') || 'null');
    var email = user ? user.email : 'guest';
    var raw = JSON.parse(localStorage.getItem('fa_journal_' + email) || '[]');
    // Convertir result_r (R-multiple) en win/loss et en montant €
    var activePlan = JSON.parse(localStorage.getItem('fa_active_plan') || 'null');
    var capital0   = activePlan && activePlan.capital0 ? activePlan.capital0 : 0;
    var riskPct    = activePlan && activePlan.riskPct     ? activePlan.riskPct     : 1;
    var riskAmt    = capital0 * riskPct / 100; // montant risqué par trade
    return raw.map(function(e){
      var rVal   = parseFloat(e.result_r || 0);
      var result = rVal > 0 ? 'win' : rVal < 0 ? 'loss' : 'be';
      // Montant en € = |R| * montant risqué (ou risque du trade si renseigné)
      var tradeRisk = e.risk_percent && capital0 ? capital0 * e.risk_percent / 100 : riskAmt;
      var amount    = Math.abs(rVal) * (tradeRisk || 50); // 50€ par défaut si plan absent
      return {
        id:       e.id || e.entry_date || Date.now().toString(),
        date:     e.entry_date || e.exit_date || new Date().toISOString().slice(0,10),
        result:   result,
        amount:   amount,
        result_r: rVal,
        note:     e.post_note || e.pre_note || ''
      };
    });
  } catch(err) { return []; }
}

// ════════════════════ INIT ════════════════════
let plan = loadPlan();
let allTrades = loadJournal();
initCurrencyToggle();
let currentPeriod = 90; // jours

// ════════════════════ FILTERING ════════════════════
function getFilteredTrades(period) {
  if (period === 'all') return allTrades;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - period);
  return allTrades.filter(t => new Date(t.date) >= cutoff);
}

// ════════════════════ METRICS ════════════════════
function computeMetrics(trades) {
  const n = trades.length;
  const wins = trades.filter(t => t.result === 'win');
  const losses = trades.filter(t => t.result === 'loss');
  const sumWins = wins.reduce((s,t) => s + t.amount, 0);
  const sumLosses = losses.reduce((s,t) => s + t.amount, 0);
  const netGain = sumWins - sumLosses;
  const capital = plan.capital0 + (allTrades.filter(t=>t.result==='win').reduce((s,t)=>s+t.amount,0)
                 - allTrades.filter(t=>t.result==='loss').reduce((s,t)=>s+t.amount,0));
  const targetProgress = Math.min(100, Math.max(0, (capital - plan.capital0)/(plan.target - plan.capital0) * 100));
  const winRate = n ? Math.round(wins.length / n * 100) : 0;
  const avgWin = wins.length ? sumWins / wins.length : 0;
  const avgLoss = losses.length ? sumLosses / losses.length : 0;
  const pf = sumLosses > 0 ? sumWins / sumLosses : (sumWins > 0 ? Infinity : 0);
  const bestTrade = wins.length ? Math.max(...wins.map(t=>t.amount)) : 0;
  const worstTrade = losses.length ? -Math.max(...losses.map(t=>t.amount)) : 0;
  const bestTradeObj = wins.find(t => t.amount === bestTrade);
  const worstTradeObj = losses.find(t => t.amount === -worstTrade);

  // Streak (dernière série consécutive)
  let streakResult = null, streakCount = 0;
  const sorted = [...trades].sort((a,b) => b.id - a.id);
  for (const t of sorted) {
    if (streakResult === null) { streakResult = t.result; streakCount = 1; }
    else if (t.result === streakResult) streakCount++;
    else break;
  }

  // Drawdown max (% par rapport au pic d'équité)
  const sortedAsc = [...trades].sort((a,b) => a.id - b.id);
  let cap = plan.capital0, peak = plan.capital0, maxDD = 0;
  for (const t of sortedAsc) {
    cap += (t.result === 'win' ? 1 : -1) * t.amount;
    if (cap > peak) peak = cap;
    const dd = peak > 0 ? (peak - cap) / peak * 100 : 0;
    if (dd > maxDD) maxDD = dd;
  }

  return {
    n, wins, losses, sumWins, sumLosses, netGain, capital, targetProgress,
    winRate, avgWin, avgLoss, pf, bestTrade, worstTrade, bestTradeObj, worstTradeObj,
    streakResult, streakCount, maxDD
  };
}

// ════════════════════ FORMATTERS ════════════════════
function getCurSym() { return (localStorage.getItem('fa_currency')||'EUR')==='USD' ? '$' : '€'; }
function fmtEUR(v) { var s=getCurSym(); return Math.round(v).toLocaleString('fr-FR') + '\u00a0' + s; }
function fmtEURsign(v) { var s=getCurSym(); return (v>=0?'+':'')+Math.round(v).toLocaleString('fr-FR')+'\u00a0'+s; }
const fmtPct = v => v.toFixed(1) + '%';

}

function dashFmt2(n){ return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// ════════════════════ TRADE LIST ════════════════════
function renderTradeList(trades) {
  const recent = [...trades].sort((a,b) => b.id - a.id).slice(0,5);
  const el = document.getElementById('tradeList');
  if (recent.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--t3);font-size:0.85rem;">Aucun trade sur cette période</div>`;
    return;
  }
  el.innerHTML = recent.map(t => {
    const dateStr = new Date(t.date).toLocaleDateString('fr-FR', { day:'2-digit', month:'short' });
    const win = t.result === 'win';
    return `
      <div class="trade-row">
        <div class="trade-dot ${win?'win':'lose'}"></div>
        <div class="trade-info">
          <div class="trade-title">${dateStr} · ${win?'Gain':'Perte'}</div>
          <div class="trade-meta">${t.note || 'Pas de note'}</div>
        </div>
        <div class="trade-amt ${win?'win':'lose'}">${win?'+':'−'}${Math.round(t.amount).toLocaleString('fr-FR')} €</div>
      </div>
    `;
  }).join('');
}

// ════════════════════ WEEKDAY GRID ════════════════════
function renderWeekdayGrid(trades) {
  const days = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const stats = [{p:0,c:0},{p:0,c:0},{p:0,c:0},{p:0,c:0},{p:0,c:0},{p:0,c:0},{p:0,c:0}];
  for (const t of trades) {
    const d = new Date(t.date);
    let idx = d.getDay() - 1; if (idx < 0) idx = 6; // Mon=0...Sun=6
    stats[idx].p += (t.result==='win'?1:-1) * t.amount;
    stats[idx].c += 1;
  }
  const maxAbs = Math.max(...stats.map(s=>Math.abs(s.p)), 1);
  const el = document.getElementById('weekdayGrid');
  el.innerHTML = days.map((d,i) => {
    const s = stats[i];
    const cls = s.p > 0 ? 'green' : (s.p < 0 ? 'red' : 'zero');
    const barW = Math.abs(s.p) / maxAbs * 100;
    return `
      <div class="wd-cell">
        <div class="wd-day">${d}</div>
        <div class="wd-pnl ${cls}">${s.p===0?'—':fmtEURsign(s.p)}</div>
        <div class="wd-count">${s.c} trade${s.c>1?'s':''}</div>
        <div class="wd-bar"><div class="wd-bar-fill ${cls}" style="width:${barW}%;"></div></div>
      </div>
    `;
  }).join('');
}

let _equity, _daily, _monthly, _dist;

// ════════════════════ EQUITY CHART ════════════════════
function renderEquityChart() {
  if (!window.Chart) return;
  const sorted = [...allTrades].sort((a,b)=>a.id - b.id);
  const labels = ['Départ'];
  const data = [plan.capital0];
  let cap = plan.capital0;
  for (const t of sorted) {
    cap += (t.result === 'win' ? 1 : -1) * t.amount;
    labels.push(new Date(t.date).toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }));
    data.push(Math.round(cap));
  }
  // Objectif théorique linéaire
  const objectiveData = labels.map((_, i) => Math.round(plan.capital0 + (i/(labels.length-1||1)) * (plan.target - plan.capital0)));

  const ctx = document.getElementById('equityChart').getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,320);
  grad.addColorStop(0,'rgba(255,215,0,0.28)');
  grad.addColorStop(1,'rgba(255,215,0,0)');

  if (_equity) _equity.destroy();
  _equity = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        { label:'Capital', data, borderColor:'#FFD700', backgroundColor:grad, borderWidth:2.5, tension:0.3, fill:true, pointRadius:0, pointHoverRadius:5 },
        { label:'Objectif', data:objectiveData, borderColor:'rgba(255,255,255,0.25)', borderWidth:1.5, borderDash:[6,6], pointRadius:0, fill:false }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{ intersect:false, mode:'index' },
      scales:{
        x:{ grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ maxRotation:0, autoSkip:true, maxTicksLimit:8 } },
        y:{ grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ callback:v => v.toLocaleString('fr-FR')+' €' } }
      },
      plugins:{
        legend:{ position:'top', align:'end', labels:{ boxWidth:8, padding:14, usePointStyle:true } },
        tooltip:{ callbacks:{ label:c => c.dataset.label+': '+c.parsed.y.toLocaleString('fr-FR')+' €' } }
      }
    }
  });
}

// ════════════════════ DAILY CHART ════════════════════
function renderDailyChart(trades) {
  if (!window.Chart) return;
  const daily = {};
  for (const t of trades) {
    const d = t.date;
    if (!daily[d]) daily[d] = 0;
    daily[d] += (t.result === 'win' ? 1 : -1) * t.amount;
  }
  const sorted = Object.keys(daily).sort();
  const labels = sorted.map(d => new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}));
  const data = sorted.map(d => Math.round(daily[d]));
  if (_daily) _daily.destroy();
  _daily = new Chart(document.getElementById('dailyChart'), {
    type:'bar',
    data:{
      labels,
      datasets:[{
        data,
        backgroundColor: data.map(v => v>=0 ? 'rgba(34,197,94,0.85)' : 'rgba(239,68,68,0.85)'),
        borderRadius:6, borderSkipped:false
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{ grid:{ display:false }, ticks:{ autoSkip:true, maxTicksLimit:10, maxRotation:0 } },
        y:{ grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ callback:v => v.toLocaleString('fr-FR')+' €' } }
      },
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => c.parsed.y.toLocaleString('fr-FR')+' €' } } }
    }
  });
}

// ════════════════════ MONTHLY CHART ════════════════════
function renderMonthlyChart() {
  if (!window.Chart) return;
  const monthly = {};
  for (const t of allTrades) {
    const d = new Date(t.date);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!monthly[k]) monthly[k] = 0;
    monthly[k] += (t.result === 'win' ? 1 : -1) * t.amount;
  }
  const sorted = Object.keys(monthly).sort();
  const labels = sorted.map(k => {
    const [y,m] = k.split('-');
    const names = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
    return names[parseInt(m)-1]+' '+y.slice(2);
  });
  const data = sorted.map(k => Math.round(monthly[k]));
  if (_monthly) _monthly.destroy();
  _monthly = new Chart(document.getElementById('monthlyChart'), {
    type:'bar',
    data:{
      labels,
      datasets:[{
        data,
        backgroundColor: data.map(v => v>=0 ? 'rgba(34,197,94,0.85)' : 'rgba(239,68,68,0.85)'),
        borderRadius:8, borderSkipped:false
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{ grid:{ display:false } },
        y:{ grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ callback:v => v.toLocaleString('fr-FR')+' €' } }
      },
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => c.parsed.y.toLocaleString('fr-FR')+' €' } } }
    }
  });
}

// ════════════════════ DIST CHART ════════════════════
function renderDistChart(m) {

        borderColor:'rgba(10,10,10,1)', borderWidth:3
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'68%',
      plugins:{
        legend:{ position:'bottom', labels:{ boxWidth:10, padding:14, usePointStyle:true } },
        tooltip:{ callbacks:{ label:c => c.label+': '+c.parsed+' ('+(c.parsed/m.n*100).toFixed(0)+'%)' } }
      }
    }
  });
}
