<!-- ========================================
    SECTION À AJOUTER APRÈS LA NAV, AVANT LE MAIN
    Intégration GNews API - Actualités Macro & Géopolitique
    ======================================== -->

<section id="news-feed" style="
    position: relative;
    z-index: 1;
    padding: 4rem 2.5rem;
    background: linear-gradient(135deg, rgba(18,18,18,0.5) 0%, rgba(22,22,22,0.3) 100%);
    border-bottom: 1px solid var(--border);
    margin-top: 2rem;
">
    <div style="max-width: 1400px; margin: 0 auto;">
        <!-- HEADER -->
        <div style="margin-bottom: 3rem; text-align: center;">
            <span style="
                display: inline-block;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--gold);
                margin-bottom: 1rem;
            ">📰 Actualités en Temps Réel</span>
            
            <h2 style="
                font-size: clamp(2rem, 5vw, 3.5rem);
                font-weight: 700;
                margin-bottom: 1rem;
                background: linear-gradient(135deg, var(--text) 0%, var(--text-muted) 100%);
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            ">Macroéconomie & Géopolitique</h2>
            
            <p style="color: var(--text-muted); font-size: 1.05rem;">
                Suivez les news économiques et géopolitiques qui impactent les marchés Forex, Crypto & Commodities
            </p>
        </div>

        <!-- NEWS FEED CONTAINER -->
        <div id="gnews-container" style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        ">
            <!-- Les news vont s'afficher ici -->
            <div style="
                grid-column: 1 / -1;
                padding: 2rem;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                text-align: center;
                color: var(--text-muted);
            ">
                ⏳ Chargement des actualités...
            </div>
        </div>

        <!-- REFRESH BUTTON & INFO -->
        <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        ">
            <button id="refresh-news" style="
                padding: 0.75rem 2rem;
                background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
                color: var(--dark);
                border: none;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
                font-size: 1rem;
            " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 30px rgba(255,215,0,0.3)';"
              onmouseout="this.style.transform='none'; this.style.boxShadow='none';">
                🔄 Actualiser les News
            </button>
            
            <span style="
                color: var(--text-faint);
                font-size: 0.9rem;
            " id="last-update">
                Chargement...
            </span>
        </div>
    </div>
</section>

<!-- ========================================
    SCRIPT D'INTÉGRATION GNEWS API
    ======================================== -->
<script>
// Configuration GNews API
const GNEWS_API_KEY = 'YOUR_API_KEY_HERE'; // 👈 REMPLACER PAR VOTRE CLÉ

// Queries ciblées pour Forex/Macro/Géopolitique
const NEWS_QUERIES = [
    { query: 'macroeconomic inflation interest rates Fed', lang: 'en', topic: '📊 Macroéconomie' },
    { query: 'geopolitical risks markets trading', lang: 'en', topic: '⚠️ Géopolitique' },
    { query: 'central bank decisions monetary policy', lang: 'en', topic: '🏛️ Banques Centrales' },
    { query: 'economic data releases employment GDP', lang: 'en', topic: '📈 Données Économiques' },
    { query: 'oil price energy crisis commodities', lang: 'en', topic: '⛽ Matières Premières' },
    { query: 'bitcoin cryptocurrency regulation SEC', lang: 'en', topic: '₿ Crypto/Finance' }
];

// Fonction pour récupérer les news
async function fetchForexNews() {
    const container = document.getElementById('gnews-container');
    const lastUpdate = document.getElementById('last-update');
    
    try {
        // Récupérer les articles des différentes catégories
        let allArticles = [];
        
        for (const category of NEWS_QUERIES) {
            const url = `https://gnews.io/api/v4/search?q=${encodeURIComponent(category.query)}&lang=${category.lang}&max=3&apikey=${GNEWS_API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.articles) {
                    // Ajouter le topic à chaque article
                    data.articles.forEach(article => {
                        article.category = category.topic;
                    });
                    allArticles.push(...data.articles);
                }
            } catch (error) {
                console.error(`Erreur pour ${category.query}:`, error);
            }
        }
        
        // Supprimer les doublons par URL
        const uniqueArticles = Array.from(new Map(allArticles.map(item => [item.url, item])).values());
        
        // Trier par date (plus récent en premier)
        uniqueArticles.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
        
        // Limiter à 12 articles max
        const topArticles = uniqueArticles.slice(0, 12);
        
        // Afficher les articles
        if (topArticles.length === 0) {
            container.innerHTML = '<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--text-muted);">Aucune actualité trouvée. Vérifiez votre clé API.</div>';
            return;
        }
        
        container.innerHTML = topArticles.map(article => `
            <div style="
                background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
                border: 1px solid var(--border);
                border-radius: 12px;
                overflow: hidden;
                transition: all 0.3s;
                display: flex;
                flex-direction: column;
                height: 100%;
            " onmouseover="this.style.transform='translateY(-8px)'; this.style.borderColor='var(--gold)'; this.style.boxShadow='0 20px 50px rgba(255,215,0,0.1)';"
              onmouseout="this.style.transform='none'; this.style.borderColor='var(--border)'; this.style.boxShadow='none';">
                
                <!-- IMAGE ARTICLE -->
                ${article.image ? `
                    <div style="
                        width: 100%;
                        height: 180px;
                        overflow: hidden;
                        background: var(--dark3);
                    ">
                        <img src="${article.image}" alt="${article.title}" style="
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                            transition: transform 0.3s;
                        " onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">
                    </div>
                ` : ''}
                
                <!-- CONTENU -->
                <div style="
                    padding: 1.5rem;
                    display: flex;
                    flex-direction: column;
                    flex-grow: 1;
                ">
                    <!-- CATEGORY BADGE -->
                    <span style="
                        display: inline-block;
                        background: rgba(255,215,0,0.15);
                        color: var(--gold);
                        padding: 0.35rem 0.75rem;
                        border-radius: 6px;
                        font-size: 0.8rem;
                        font-weight: 600;
                        margin-bottom: 0.75rem;
                        width: fit-content;
                    ">${article.category}</span>
                    
                    <!-- TITRE -->
                    <h3 style="
                        margin: 0 0 0.75rem 0;
                        font-size: 1.1rem;
                        font-weight: 600;
                        color: var(--text);
                        line-height: 1.4;
                        flex-grow: 1;
                    ">${article.title}</h3>
                    
                    <!-- DESCRIPTION -->
                    <p style="
                        color: var(--text-muted);
                        font-size: 0.95rem;
                        margin: 0 0 1rem 0;
                        line-height: 1.5;
                        flex-grow: 1;
                    ">${article.description || 'Lire l\'article complet'}</p>
                    
                    <!-- SOURCE & DATE -->
                    <div style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        color: var(--text-faint);
                        font-size: 0.85rem;
                        margin-bottom: 1rem;
                    ">
                        <span style="font-weight: 500;">${article.source.name}</span>
                        <span>${new Date(article.publishedAt).toLocaleDateString('fr-FR', { 
                            month: 'short', 
                            day: 'numeric', 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        })}</span>
                    </div>
                    
                    <!-- LIEN -->
                    <a href="${article.url}" target="_blank" rel="noopener noreferrer" style="
                        display: inline-block;
                        padding: 0.75rem 1.5rem;
                        background: linear-gradient(135deg, rgba(255,215,0,0.2) 0%, rgba(255,193,7,0.1) 100%);
                        border: 1px solid var(--border);
                        color: var(--gold);
                        text-decoration: none;
                        border-radius: 8px;
                        font-weight: 600;
                        text-align: center;
                        transition: all 0.3s;
                        cursor: pointer;
                    " onmouseover="this.style.background='rgba(255,215,0,0.3)'; this.style.borderColor='var(--gold)';"
                      onmouseout="this.style.background='rgba(255,215,0,0.2)'; this.style.borderColor='var(--border)';">
                        📰 Lire l'article →
                    </a>
                </div>
            </div>
        `).join('');
        
        // Mise à jour du timestamp
        const now = new Date();
        lastUpdate.textContent = `Dernière mise à jour: ${now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
        
    } catch (error) {
        console.error('Erreur GNews:', error);
        container.innerHTML = `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--red);">
            ⚠️ Erreur de connexion à l'API. Vérifiez votre clé API GNews.
        </div>`;
    }
}

// Bouton Actualiser
document.getElementById('refresh-news').addEventListener('click', () => {
    document.getElementById('refresh-news').textContent = '⏳ Chargement...';
    fetchForexNews();
    setTimeout(() => {
        document.getElementById('refresh-news').textContent = '🔄 Actualiser les News';
    }, 1000);
});

// Charger au chargement de la page
window.addEventListener('load', fetchForexNews);

// Actualiser toutes les 30 minutes
setInterval(fetchForexNews, 30 * 60 * 1000);

console.log('✅ GNews API chargé - Actualités macroéconomiques en temps réel');
</script>
